name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check frontend
        run: npm run check

      - name: Type-check account Worker
        run: npm run check:worker

      - name: Run tests
        run: npm test

      - name: Build canonical Cloudflare site
        run: npm run build
        env:
          BASE_PATH: ''

      - name: Validate Worker deployment
        run: npx wrangler deploy --dry-run --env=""

      - name: Build historical subpath compatibility
        run: npm run build
        env:
          BASE_PATH: /litrpg-hub
